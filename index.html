<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具导航 - 高效工作从这里开始</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            color: #2c3e50;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 1rem;
        }
        
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            max-width: 600px;
            line-height: 1.6;
        }
        
        .search-box {
            width: 100%;
            max-width: 600px;
            margin-bottom: 4rem;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }
        
        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #3498db;
            font-size: 1.2rem;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1000px;
        }
        
        .tool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        
        .tool-item:hover {
            transform: translateY(-10px);
        }
        
        .tool-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            background: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .tool-item:hover .tool-circle {
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .tool-circle::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.1), rgba(41, 128, 185, 0.2));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .tool-item:hover .tool-circle::after {
            opacity: 1;
        }
        
        .tool-icon {
            font-size: 2.5rem;
            color: #3498db;
            z-index: 1;
        }
        
        .tool-name {
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
        }
        
        .footer {
            margin-top: 5rem;
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 1.5rem;
            }
            
            .tool-circle {
                width: 100px;
                height: 100px;
            }
            
            .tool-icon {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .tools-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            
            .tool-circle {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>工具导航</h1>
            <p class="subtitle">高效工作与创意设计的完美起点，精选工具助您事半功倍</p>
        </header>
        
        <div class="search-box">
            <input type="text" class="search-input" placeholder="搜索工具...">
            <div class="search-icon">
                <i class="fas fa-search"></i>
            </div>
        </div>
        
        <div class="tools-grid">
            <!-- 工具项 -->
            <a href="./anime.html" class="tool-item">
                <div class="tool-circle">
                    <i class="fas fa-share-alt tool-icon"></i>
                </div>
                <span class="tool-name">动漫收藏</span>
            </a>
            
            <a href="#" class="tool-item">
                <div class="tool-circle">
                    <i class="fas fa-code tool-icon"></i>
                </div>
                <span class="tool-name">开发工具</span>
            </a>
            
            <a href="./bi.html" class="tool-item">
                <div class="tool-circle">
                    <i class="fas fa-chart-bar tool-icon"></i>
                </div>
                <span class="tool-name">数据BI</span>
            </a>
            
            <a href="#" class="tool-item">
                <div class="tool-circle">
                    <i class="fas fa-image tool-icon"></i>
                </div>
                <span class="tool-name">图片资源</span>
            </a>
            
            <a href="#" class="tool-item">
                <div class="tool-circle">
                    <i class="fas fa-video tool-icon"></i>
                </div>
                <span class="tool-name">视频工具</span>
            </a>
            
            <a href="#" class="tool-item">
                <div class="tool-circle">
                    <i class="fas fa-music tool-icon"></i>
                </div>
                <span class="tool-name">音频工具</span>
            </a>
            
            <a href="./rename.html" class="tool-item">
                <div class="tool-circle">
                    <i class="fas fa-file-pdf tool-icon"></i>
                </div>
                <span class="tool-name">文档处理</span>
            </a>
            
            <a href="./FolderPort.html" class="tool-item">
                <div class="tool-circle">
                    <i class="fas fa-cloud tool-icon"></i>
                </div>
                <span class="tool-name">云分享</span>
            </a>
        </div>
        
        <footer class="footer">
            <p>© 工具导航 | 让工作更高效</p>
        </footer>
    </div>

    <script>
        // 简单的搜索功能
        document.querySelector('.search-input').addEventListener('keyup', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const toolItems = document.querySelectorAll('.tool-item');
            
            toolItems.forEach(item => {
                const toolName = item.querySelector('.tool-name').textContent.toLowerCase();
                if (toolName.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
