---
layout: null
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>页面导航首页</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.6; }
    h1 { border-bottom: 2px solid #eaecef; padding-bottom: 12px; color: #24292e; }
    ul { list-style: none; padding-left: 0; }
    li { margin: 10px 0; padding: 12px 16px; background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px; }
    a { color: #0366d6; text-decoration: none; font-weight: 600; font-size: 16px; display: block; }
    a:hover { text-decoration: underline; color: #0056b3; }
    .path { font-size: 12px; color: #6a737d; margin-top: 4px; font-weight: normal; }
  </style>
</head>
<body>

  <h1>网站页面目录</h1>
  <ul>
    <!-- 遍历仓库中的所有文件，自动筛选 HTML 文件 -->
    {% for file in site.static_files %}
      {% if file.extname == '.html' and file.path != '/index.html' %}
        <li>
          <a href="{{ file.path | relative_url }}">
            📄 {{ file.name | replace: '.html', '' }}
            <div class="path">链接路径：{{ file.path }}</div>
          </a>
        </li>
      {% endif %}
    {% endfor %}
  </ul>

</body>
</html>
